name: Update requirement tracker
on:
  push:
    branches: [main]
    paths:
      - docs/requirements/compliance-checklist.md
      - scripts/update-readme.ps1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refresh tracker
        shell: pwsh
        run: ./scripts/update-readme.ps1
      - name: Save changes
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh requirement tracker"
          git push
